# Hotspot access point. pi/setup.sh installs this with the SSID and password
# from .env filled in.
#
# hostapd rather than NetworkManager's own AP mode: NetworkManager always offers
# the WPA-PSK-SHA256 suite in the handshake, the Pi Zero W firmware leaves it
# out of the beacon, and every client drops the mismatch ("IE in 3/4 msg does
# not match with IE in Beacon/ProbeResp"). The kernel already carries the
# regulatory country from cmdline.txt, so none is set here.
interface=wlan0
driver=nl80211
ssid=__SSID__
wpa_passphrase=__PASSWORD__
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
ieee80211w=0
